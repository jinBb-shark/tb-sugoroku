<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>トロンボーンすごろく</title>
<style>
:root{--bg:#fbf7ef;--ink:#2b2420;--muted:#7a6f66;--accent:#b8860b}
@media (prefers-color-scheme: dark){:root{--bg:#1d1a17;--ink:#f1ebe3;--muted:#a99d90;--accent:#d9a52b}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);display:flex;align-items:center;justify-content:center;
  font-family:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;text-align:center;padding:16px}
.icon{font-size:3rem;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
h1{margin:12px 0 4px;font-size:1.6rem;letter-spacing:.05em}
.wip{display:inline-block;margin-top:6px;padding:4px 14px;border-radius:999px;background:var(--accent);color:var(--bg);font-weight:700}
p{color:var(--muted);font-size:.9rem;margin:14px 0 0}
</style>
</head>
<body>
<main>
  <div class="icon">🎲</div>
  <h1>トロンボーンすごろく</h1>
  <div class="wip">作成中！</div>
  <p>神戸大学応援団総部吹奏楽部 第59回定期演奏会</p>
</main>
</body>
</html>
