<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>トロンボーンすごろく</title>
<style>
:root{
  --bg:#fbf7ef; --ink:#2b2420; --muted:#7a6f66; --card:#ffffff; --line:#e3d9c9;
  --accent:#b8860b; --accent-ink:#fff; --start:#e8f3e8; --goal:#fdeaea;
  --fwd:#e6f0fb; --back:#fbe9e6; --rest:#f1ecfb; --again:#fff6d6;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#1d1a17; --ink:#f1ebe3; --muted:#a99d90; --card:#2a2622; --line:#40392f;
    --accent:#d9a52b; --accent-ink:#1d1a17; --start:#24372a; --goal:#43282a;
    --fwd:#22324a; --back:#46302b; --rest:#33294a; --again:#463d1f;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;line-height:1.5}
header{padding:16px 16px 8px;text-align:center}
h1{margin:0;font-size:1.4rem;letter-spacing:.05em}
header p{margin:4px 0 0;color:var(--muted);font-size:.85rem}
main{max-width:720px;margin:0 auto;padding:0 12px 120px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
label{display:block;font-size:.9rem;margin:8px 0 4px}
input[type=text]{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;
  background:var(--bg);color:var(--ink);font-size:1rem}
button{font:inherit;border:0;border-radius:10px;padding:12px 18px;cursor:pointer;
  background:var(--accent);color:var(--accent-ink);font-weight:700}
button.sub{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:400}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.board{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.sq{position:relative;min-height:74px;border-radius:10px;border:1px solid var(--line);
  background:var(--card);padding:4px 5px 22px;font-size:.68rem;overflow:hidden;cursor:pointer}
.sq .n{font-weight:700;font-size:.75rem;color:var(--muted)}
.sq .t{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.sq.start{background:var(--start)} .sq.goal{background:var(--goal)}
.sq.fwd{background:var(--fwd)} .sq.back{background:var(--back)}
.sq.rest{background:var(--rest)} .sq.again{background:var(--again)}
.sq.cur{outline:3px solid var(--accent)}
.tokens{position:absolute;left:4px;bottom:4px;display:flex;gap:2px}
.tok{width:14px;height:14px;border-radius:50%;border:2px solid var(--card);box-shadow:0 0 0 1px rgba(0,0,0,.25)}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);
  padding:10px 16px calc(10px + env(safe-area-inset-bottom));}
.bar .in{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:12px}
.die{width:52px;height:52px;border-radius:12px;border:2px solid var(--ink);display:grid;place-items:center;
  font-size:1.6rem;font-weight:800;flex:none}
.die.roll{animation:shake .5s}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-15deg)}75%{transform:rotate(15deg)}}
.turn{flex:1;font-size:.95rem}
.turn b{display:inline-flex;align-items:center;gap:6px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal.on{display:flex}
.modal .box{background:var(--card);border-radius:16px;padding:20px;max-width:420px;width:100%;text-align:center}
.modal h2{margin:0 0 8px;font-size:1.1rem}
.modal p{margin:0 0 16px;white-space:pre-wrap}
.legend{display:flex;flex-wrap:wrap;gap:6px;font-size:.75rem;color:var(--muted);margin-top:8px}
.legend span{padding:2px 8px;border-radius:999px;border:1px solid var(--line)}
.hidden{display:none}
</style>
</head>
<body>
<header>
  <h1>🎶 トロンボーンすごろく</h1>
  <p>神戸大学応援団総部吹奏楽部 第59回定期演奏会</p>
</header>
<main>
  <section class="panel" id="setup">
    <div class="row" style="justify-content:space-between">
      <strong>あそぶ人数</strong>
      <div class="row" id="countBtns"></div>
    </div>
    <div id="nameInputs"></div>
    <div style="margin-top:14px;text-align:center"><button id="startBtn">スタート！</button></div>
  </section>

  <section id="game" class="hidden">
    <div class="board" id="board"></div>
    <div class="legend">
      <span style="background:var(--fwd)">すすむ</span>
      <span style="background:var(--back)">もどる</span>
      <span style="background:var(--rest)">1回休み</span>
      <span style="background:var(--again)">もう1回</span>
    </div>
    <div style="text-align:center;margin-top:16px"><button class="sub" id="resetBtn">最初からやり直す</button></div>
  </section>
</main>

<div class="bar hidden" id="bar"><div class="in">
  <div class="die" id="die">🎲</div>
  <div class="turn" id="turn"></div>
  <button id="rollBtn">サイコロ</button>
</div></div>

<div class="modal" id="modal"><div class="box">
  <h2 id="mTitle"></h2><p id="mBody"></p>
  <button id="mOk">OK</button>
</div></div>

<script>
/* ===========================================================
   ここを編集するとマスの内容が変わります
   type: "fwd"=すすむ / "back"=もどる / "rest"=1回休み / "again"=もう1回 / なし=ふつう
   n: すすむ・もどるマス数
   ※ いまの内容は仮です。部員の情報に差し替えてください。
   =========================================================== */
const SQUARES = [
  { text: "スタート", type: "start" },
  { text: "入部おめでとう！トロンボーンパートへようこそ" },
  { text: "（仮）〇〇さんの好きな食べ物はラーメン。2マスすすむ", type: "fwd", n: 2 },
  { text: "（仮）スライドにグリスを塗り忘れた…1マスもどる", type: "back", n: 1 },
  { text: "（仮）パート練習で〇〇さんがお菓子を配る" },
  { text: "（仮）ロングトーンが10秒伸びた！もう1回サイコロ", type: "again" },
  { text: "（仮）〇〇さんの出身地クイズ" },
  { text: "（仮）マウスピースを家に忘れた。1回休み", type: "rest" },
  { text: "（仮）〇〇さんの特技は？3マスすすむ", type: "fwd", n: 3 },
  { text: "（仮）7ポジションが届かない！2マスもどる", type: "back", n: 2 },
  { text: "（仮）合奏で褒められた" },
  { text: "（仮）パート飲み会（ジュース）で盛り上がる。もう1回", type: "again" },
  { text: "（仮）〇〇さんの口ぐせ" },
  { text: "（仮）楽器ケースが重すぎる。1回休み", type: "rest" },
  { text: "（仮）ハイB♭が出た！2マスすすむ", type: "fwd", n: 2 },
  { text: "（仮）〇〇さんの好きな曲" },
  { text: "（仮）ミュートを落として大きな音。3マスもどる", type: "back", n: 3 },
  { text: "（仮）〇〇さんのマイブーム" },
  { text: "（仮）グリッサンドがきれいに決まった。1マスすすむ", type: "fwd", n: 1 },
  { text: "（仮）本番前の円陣！もう1回", type: "again" },
  { text: "（仮）〇〇さんの意外な一面" },
  { text: "（仮）譜めくりに失敗。2マスもどる", type: "back", n: 2 },
  { text: "（仮）ゲネプロ。1回休み", type: "rest" },
  { text: "（仮）〇〇さんからひとこと" },
  { text: "ゴール！定期演奏会、本番です🎉", type: "goal" },
];

const COLORS = ["#d64545", "#2f7de1", "#2fa36b", "#e0a21b"];
const $ = s => document.querySelector(s);
const GOAL = SQUARES.length - 1;
let count = 2, players = [], cur = 0, busy = false, finished = false;

/* ---------- 設定画面 ---------- */
function renderSetup(){
  const cb = $("#countBtns"); cb.innerHTML = "";
  [1,2,3,4].forEach(k=>{
    const b = document.createElement("button");
    b.textContent = k + "人"; b.className = k===count ? "" : "sub";
    b.onclick = ()=>{ count = k; renderSetup(); };
    cb.appendChild(b);
  });
  const ni = $("#nameInputs"); const old = [...ni.querySelectorAll("input")].map(i=>i.value);
  ni.innerHTML = "";
  for(let i=0;i<count;i++){
    const l = document.createElement("label");
    l.innerHTML = `<span style="color:${COLORS[i]}">●</span> プレイヤー${i+1}`;
    const inp = document.createElement("input"); inp.type="text";
    inp.placeholder = `プレイヤー${i+1}`; inp.value = old[i] || "";
    ni.append(l, inp);
  }
}
$("#startBtn").onclick = ()=>{
  const names = [...document.querySelectorAll("#nameInputs input")].map((i,k)=>i.value.trim()||`プレイヤー${k+1}`);
  players = names.map((name,i)=>({name,color:COLORS[i],pos:0,rest:0,done:false}));
  cur = 0; finished = false;
  $("#setup").classList.add("hidden"); $("#game").classList.remove("hidden"); $("#bar").classList.remove("hidden");
  $("#die").textContent = "🎲";
  renderBoard(); renderTurn();
};
$("#resetBtn").onclick = ()=>{
  $("#setup").classList.remove("hidden"); $("#game").classList.add("hidden"); $("#bar").classList.add("hidden");
};

/* ---------- 盤面 ---------- */
function renderBoard(){
  const b = $("#board"); b.innerHTML = "";
  const cols = 5;
  // 蛇行（ジグザグ）に並べる
  const order = [];
  for(let r=0; r*cols < SQUARES.length; r++){
    const row = [];
    for(let c=0;c<cols;c++){ const i=r*cols+c; if(i<SQUARES.length) row.push(i); }
    if(r%2===1) row.reverse();
    while(row.length<cols) r%2===1 ? row.unshift(-1) : row.push(-1);
    order.push(...row);
  }
  order.forEach(i=>{
    const d = document.createElement("div");
    if(i<0){ b.appendChild(d); return; }
    const s = SQUARES[i];
    d.className = "sq " + (s.type||"");
    if(players[cur] && players[cur].pos===i && !finished) d.classList.add("cur");
    d.innerHTML = `<div class="n">${i===0?"S":i===GOAL?"G":i}</div><div class="t">${esc(s.text)}</div>`;
    const t = document.createElement("div"); t.className="tokens";
    players.forEach(p=>{ if(p.pos===i){ const k=document.createElement("span"); k.className="tok"; k.style.background=p.color; t.appendChild(k);} });
    d.appendChild(t);
    d.onclick = ()=>showModal(`${i===0?"スタート":i===GOAL?"ゴール":i+"マス目"}`, s.text);
    b.appendChild(d);
  });
}
function renderTurn(){
  if(finished){ $("#turn").innerHTML = "ゲーム終了！"; $("#rollBtn").disabled = true; return; }
  const p = players[cur];
  $("#turn").innerHTML = `<b><span class="tok" style="background:${p.color}"></span>${esc(p.name)}</b> の番`;
  $("#rollBtn").disabled = false;
}
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

/* ---------- モーダル ---------- */
let onOk = null;
function showModal(title, body, cb){
  $("#mTitle").textContent = title; $("#mBody").textContent = body;
  onOk = cb || null; $("#modal").classList.add("on");
}
$("#mOk").onclick = ()=>{ $("#modal").classList.remove("on"); const f=onOk; onOk=null; if(f) f(); };

/* ---------- 進行 ---------- */
const sleep = ms => new Promise(r=>setTimeout(r,ms));
async function step(p, dir, n){
  for(let k=0;k<n;k++){
    let next = p.pos + dir;
    if(next>GOAL){ next = GOAL; } if(next<0){ next = 0; }
    p.pos = next; renderBoard(); await sleep(220);
    if(p.pos===GOAL) break;
  }
}
$("#rollBtn").onclick = async ()=>{
  if(busy || finished) return; busy = true; $("#rollBtn").disabled = true;
  const p = players[cur];
  const die = $("#die"); die.classList.remove("roll"); void die.offsetWidth; die.classList.add("roll");
  for(let k=0;k<8;k++){ die.textContent = 1+Math.floor(Math.random()*6); await sleep(60); }
  const n = 1+Math.floor(Math.random()*6); die.textContent = n;
  await sleep(250);
  await step(p, 1, n);
  await land(p);
};
function land(p){
  return new Promise(resolve=>{
    const s = SQUARES[p.pos];
    if(p.pos===GOAL){
      p.done = true;
      showModal(`🎉 ${p.name} ゴール！`, s.text, ()=>{ finished = true; renderBoard(); renderTurn(); busy=false; resolve(); });
      return;
    }
    const title = `${p.name}：${p.pos}マス目`;
    showModal(title, s.text, async ()=>{
      let again = false;
      if(s.type==="fwd"){ await step(p, 1, s.n||1); if(p.pos===GOAL){ busy=false; await land(p); return resolve(); } }
      else if(s.type==="back"){ await step(p, -1, s.n||1); }
      else if(s.type==="rest"){ p.rest = 1; }
      else if(s.type==="again"){ again = true; }
      nextTurn(again); busy=false; resolve();
    });
  });
}
function nextTurn(again){
  if(!again){
    for(let k=0;k<players.length;k++){
      cur = (cur+1) % players.length;
      if(players[cur].rest>0){ players[cur].rest--; continue; }
      break;
    }
  }
  renderBoard(); renderTurn();
}
renderSetup();
</script>
</body>
</html>
